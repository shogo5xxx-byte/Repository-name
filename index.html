let running=false,queue=[],timer=null,battleEnemy=null,battleHp=0,battleMax=0,battleLines=[];
function picture(id){return art[id]?'<img class="portrait" src="'+art[id]+'" alt="'+mons[id].name+'">':'<div class="portrait-fallback">'+mons[id].icon+'</div>'}
function stop(){running=false;clearTimeout(timer);timer=null;queue=[];}
function line(t){battleLines.push(t);battleLines=battleLines.slice(-90);const el=$('liveLog');if(el){el.textContent=battleLines.join('\n');el.scrollTop=el.scrollHeight}}
function step(){if(!running)return;if(!queue.length){makeBattle();}const job=queue.shift();if(job){job();save();}timer=setTimeout(step,620)}
function makeBattle(){const m=active();if(!m){stop();return;}const area=areas[state.area],enemyId=area.ids[rand(area.ids.length)],enemy=mons[enemyId],my=values(m);let hp=my[0],ehp=enemy.stats[0]+rand(12),rounds=0;queue.push(()=>{battleEnemy=enemyId;battleHp=ehp;battleMax=ehp;drawEnemy();line('【'+area.name+'】'+enemy.name+'が現れた！')});while(hp>0&&ehp>0&&rounds++<25){const hit=Math.max(1,my[1]+rand(8)-Math.floor(enemy.stats[2]*.45));ehp-=hit;const remaining=Math.max(0,ehp);queue.push(()=>{battleHp=remaining;drawEnemy();line(mons[m.id].name+'の攻撃！ '+enemy.name+'に'+hit+'ダメージ！')});if(ehp<=0)break;const dmg=Math.max(1,enemy.stats[1]+rand(6)-Math.floor(my[2]*.45));hp-=dmg;queue.push(()=>line(enemy.name+'の攻撃！ '+mons[m.id].name+'に'+dmg+'ダメージ！'));}if(ehp<=0){const xp=7+rand(10)+state.area*5;queue.push(()=>{state.wins++;rewardXp(m,xp);line(enemy.name+'を倒した！ 経験値+'+xp);if(Math.random()<.24){state.items['鍛錬の実']++;line('鍛錬の実を手に入れた！')}if(Math.random()<.08){state.items[area.drop]=(state.items[area.drop]||0)+1;line(area.drop+'を手に入れた！')}if(!state.party.some(x=>x.id===enemyId)&&Math.random()<.22){state.party.push(create(enemyId));state.seen=[...new Set([...state.seen,enemyId])];line('★ '+enemy.name+'が仲間になった！')}const w=$('wins');if(w)w.textContent=state.wins;});}else queue.push(()=>line('敗北… また挑戦しよう！'));}
function drawEnemy(){const el=$('enemy');if(!el)return;el.innerHTML=battleEnemy?picture(battleEnemy)+'<strong>'+mons[battleEnemy].name+'</strong><div class="bar"><span style="width:'+Math.max(0,100*battleHp/battleMax)+'%"></span></div><small>HP '+battleHp+' / '+battleMax+'</small>':'<div class="portrait-fallback">？</div><small>敵を待っています</small>';}
function startBattle(){if(running)return;running=true;step();} 
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||!Array.isArray(state.party))state={party:[],active:null,seen:[],recipes:[],items:{'鍛錬の実':0,'炎の石':0,'生命の雫':0},area:0,wins:0,logs:[],page:'start',auto:false};
state.auto=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function maxLv(m){return m.id in mons && extra.some(x=>x[0]===m.id)?30:15}
function create(id){return {id,lv:1,xp:0,bonus:[0,0,0,0,0],hp:null}}
function values(m){const b=mons[m.id].stats;return b.map((v,i)=>Math.min(v*3,Math.floor(v*(1+(m.lv-1)*.085))+m.bonus[i]))}
function caps(m){return mons[m.id].stats.map(x=>x*3)}
function full(m){return values(m).every((v,i)=>v>=caps(m)[i])}
function xpNeed(m){return 12+m.lv*9}
function active(){return state.party.find(m=>m.id===state.active)||null}
function log(t){state.logs.unshift(t);state.logs=state.logs.slice(0,14)}
function rand(n){return Math.floor(Math.random()*n)}
function rewardXp(m,n){if(m.lv>=maxLv(m))return; m.xp+=n;while(m.lv<maxLv(m)&&m.xp>=xpNeed(m)){m.xp-=xpNeed(m);m.lv++;log('★ '+mons[m.id].name+' は Lv.'+m.lv+' になった！')}if(m.lv>=maxLv(m)){m.xp=0;log('★ レベルMAX！ 合成が可能になった。')}}
function btn(label,fn,cls='',disabled=false){return '<button '+(disabled?'disabled ':'')+'class="'+cls+'" data-action="'+fn+'">'+label+'</button>'}
function nav(){return '<div class="nav">'+[['home','魔物'],['battle','探索'],['fusion','合成'],['book','図鑑']].map(([id,t])=>btn(t,'page:'+id,state.page===id?'green':'')).join('')+'</div>'}
function status(m){let v=values(m),c=caps(m);return '<div class="sprite">'+mons[m.id].icon+'</div><div style="text-align:center"><strong>'+mons[m.id].name+'</strong> <span class="tag">'+mons[m.id].race+'</span><p>Lv.'+m.lv+' / '+maxLv(m)+'　'+(m.lv>=maxLv(m)?'MAX':'EXP '+m.xp+'/'+xpNeed(m))+'</p></div>'+['HP','攻撃','防御','素早さ','運'].map((t,i)=>'<div class="stat"><span>'+t+'</span><span>'+v[i]+' / '+c[i]+'<div class="bar"><span style="width:'+(100*v[i]/c[i])+'%"></span></div></span></div>').join('')}
function render(){
let out='';
if(!state.party.length){state.page='start';out='<h2>最初の種族を選ぼう</h2><p class="muted">好きな種族の最下位モンスター1匹から始まる。後からほかの種族も仲間にできるで！</p><div class="grid">'+base.map(x=>btn('<div class="tiny">'+x[3]+'</div>'+x[1]+'<br><small>'+x[2]+'</small>','start:'+x[0])).join('')+'</div>'}
else{
out=nav();
if(state.page==='home'){const m=active();out+='<h2>マイモンスター</h2><div class="card">'+(m?status(m):'モンスターを選んでください')+'</div><h2>待機所　'+state.party.length+'匹</h2>'+state.party.map(m=>'<div class="row"><span>'+mons[m.id].icon+' '+mons[m.id].name+' Lv.'+m.lv+(state.active===m.id?' ★':'')+'</span>'+btn('育成に選ぶ','select:'+m.id,'',state.active===m.id)+'</div>').join('')+'<div class="card"><h2>育成アイテム</h2><p>鍛錬の実 × '+(state.items['鍛錬の実']||0)+'</p><p class="muted">能力を選んで強化。Lv.MAX後も使える。</p><div class="grid">'+['HP','攻撃','防御','素早さ','運'].map((t,i)=>btn(t+' +'+(i===0?6:2),'train:'+i,'',!(state.items['鍛錬の実']>0)||!m||values(m)[i]>=caps(m)[i])).join('')+'</div></div><div class="card"><h2>進化</h2>'+(m&&evo[m.id]?'<p>進化先：？？？</p><p>必要：'+evo[m.id].item+' ×1'+(evo[m.id].full?' ＋ 全能力MAX':' ＋ Lv.MAX')+'</p>'+btn('進化させる','evolve','green',!(state.items[evo[m.id].item]>0)||m.lv<maxLv(m)||(evo[m.id].full&&!full(m))):'<p class="muted">現在発見できる進化はありません。進化先は未知のままです。</p>')+'</div>'}
else if(state.page==='battle'){const area=areas[state.area]||areas[0];out+='<h2>ダンジョン</h2><div class="card"><div class="row"><strong>'+area.name+'</strong><span>勝利 <span id="wins">'+state.wins+'</span>回</span></div><select id="area" style="width:100%">'+areas.map((a,i)=>'<option value="'+i+'" '+(state.area===i?'selected':'')+' '+(state.wins<a.min-1?'disabled':'')+'>'+a.name+(state.wins<a.min-1?'（未解放）':'')+'</option>').join('')+'</select></div><div class="arena"><div class="combatants"><div class="fighter">'+picture(active().id)+'<strong>'+mons[active().id].name+'</strong><p class="muted">Lv.'+active().lv+'</p></div><div class="fighter" id="enemy"></div></div></div><div class="fightcontrols">'+btn('▶ 戦闘開始','begin','green')+btn('■ 停止','stop')+btn('ログ消去','clear')+'</div><p class="muted">戦闘開始で自動周回。攻撃ごとにログが流れ、倒すと次の敵へ進む。</p><h2>戦闘ログ</h2><div id="liveLog" class="battlelog"></div>';setTimeout(()=>{drawEnemy();const el=$('liveLog');if(el){el.textContent=battleLines.join('\n');el.scrollTop=el.scrollHeight}},0)}
else if(state.page==='fusion'){out+='<h2>合成</h2><p class="muted">素材2匹ともLv.MAXで合成できる。合成後は2匹とも消え、同じ種類を再び捕獲できる。</p><div class="card"><label>素材①</label><select id="a" style="width:100%"><option value="">選択</option>'+state.party.map(m=>'<option value="'+m.id+'">'+mons[m.id].name+' Lv.'+m.lv+'</option>').join('')+'</select><br><br><label>素材②</label><select id="b" style="width:100%"><option value="">選択</option>'+state.party.map(m=>'<option value="'+m.id+'">'+mons[m.id].name+' Lv.'+m.lv+'</option>').join('')+'</select><p>合成結果：<strong>？？？</strong></p>'+btn('合成する','fuse','green')+'</div><p class="muted">合成レシピは一部の組み合わせから発見できる。未対応の組み合わせでは素材は消費されません。</p><h2>発見済みレシピ</h2>'+(state.recipes.length?state.recipes.map(k=>'<p>'+k.split('+').map(x=>mons[x].name).join(' ＋ ')+' → '+mons[recipes[k]].name+'</p>').join(''):'まだありません')}
else if(state.page==='book'){out+='<h2>魔物図鑑</h2><p>発見：'+state.seen.length+' / '+Object.keys(mons).length+'</p><div class="grid">'+Object.values(mons).map(m=>'<div class="card" style="text-align:center">'+(state.seen.includes(m.id)?'<div class="tiny">'+m.icon+'</div>'+m.name+'<div class="muted">'+m.race+'</div>':'<div class="tiny">？</div>？？？')+'</div>').join('')+'</div>'}
}
$('app').innerHTML=out;save();
}
function fight(){const m=active();if(!m)return;const area=areas[state.area];const enemyId=area.ids[rand(area.ids.length)],enemy=mons[enemyId],my=values(m);let hp=my[0],ehp=enemy.stats[0]+rand(12),lines=['【'+area.name+'】 '+enemy.name+' が現れた！'];let rounds=0;while(hp>0&&ehp>0&&rounds++<25){const hit=Math.max(1,my[1]+rand(8)-Math.floor(enemy.stats[2]*.45));ehp-=hit;lines.push(mons[m.id].name+'の攻撃！ '+enemy.name+'に'+hit+'ダメージ');if(ehp<=0)break;const dmg=Math.max(1,enemy.stats[1]+rand(6)-Math.floor(my[2]*.45));hp-=dmg;lines.push(enemy.name+'の攻撃！ '+mons[m.id].name+'に'+dmg+'ダメージ')}if(ehp<=0){state.wins++;const xp=7+rand(10)+state.area*5;lines.push(enemy.name+'を倒した！ 経験値+'+xp);rewardXp(m,xp);if(Math.random()<.24){state.items['鍛錬の実']++;lines.push('鍛錬の実を手に入れた！')}if(Math.random()<.08){state.items[area.drop]=(state.items[area.drop]||0)+1;lines.push(area.drop+'を手に入れた！')}if(!state.party.some(x=>x.id===enemyId)&&Math.random()<.22){state.party.push(create(enemyId));state.seen=[...new Set([...state.seen,enemyId])];lines.push('★ '+enemy.name+'が仲間になった！')}}else lines.push('敗北… また挑戦しよう！');log(lines.join('\n'))}
function act(cmd){const [type,arg]=cmd.split(':');if(type==='begin'){startBattle();return}if(type==='stop'){stop();line('戦闘を停止した。');return}if(type==='clear'){battleLines=[];line('ログを消去した。');return}if(running)stop();if(type==='page'){state.page=arg}else if(type==='start'){state.party=[create(arg)];state.active=arg;state.seen=[arg];state.page='home'}else if(type==='select'){state.active=arg}else if(type==='fight'){fight()}else if(type==='ten'){for(let i=0;i<10;i++)fight()}else if(type==='train'){const m=active(),i=+arg;if(m&&state.items['鍛錬の実']>0&&values(m)[i]<caps(m)[i]){m.bonus[i]+=i===0?6:2;state.items['鍛錬の実']--;log('鍛錬の実で'+['HP','攻撃','防御','素早さ','運'][i]+'が上がった！')}}else if(type==='evolve'){const m=active(),e=m&&evo[m.id];if(e&&m.lv>=maxLv(m)&&state.items[e.item]>0&&(!e.full||full(m))&&!state.party.some(x=>x.id===e.to)){state.items[e.item]--;state.party=state.party.filter(x=>x!==m);state.party.push(create(e.to));state.active=e.to;state.seen=[...new Set([...state.seen,e.to])];alert('進化成功！ '+mons[e.to].name+'になった！')}}else if(type==='fuse'){const a=$('a').value,b=$('b').value;if(!a||!b||a===b){alert('違う2匹を選んでな！');return}const ma=state.party.find(x=>x.id===a),mb=state.party.find(x=>x.id===b);if(!ma||!mb||ma.lv<maxLv(ma)||mb.lv<maxLv(mb)){alert('2匹ともレベルMAXが必要やで！');return}const k=[a,b].sort().join('+'),id=recipes[k];if(!id){alert('この組み合わせの合成はまだ発見できません。素材はそのままです。');return}if(state.party.some(x=>x.id===id)){alert('合成結果の魔物をすでに所持しています。');return}if(!confirm('素材の2匹は消えるで。合成する？'))return;state.party=state.party.filter(x=>x.id!==a&&x.id!==b);state.party.push(create(id));state.active=id;state.seen=[...new Set([...state.seen,id])];state.recipes=[...new Set([...state.recipes,k])];alert('合成成功！ '+mons[id].name+'が誕生した！');state.page='home'}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='area'){stop();state.area=+e.target.value;render()}});
render();
})();
</script></body></html>
